<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Aidress_logoonly.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MVPEGLP87T"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-MVPEGLP87T');
    </script>

    <!-- Primary SEO -->
    <title>Aidress — The coordination protocol for autonomous AI agents</title>
    <meta name="description" content="Aidress lets agents discover, verify, and transact with counterparties they have never met, without a human in the loop." />
    <meta name="keywords" content="AI agents, agentic economy, agent coordination, A2A transactions, agent infrastructure, AI infrastructure, agent identity, agent trust, autonomous agents" />
    <meta name="author" content="Aidress" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <!-- No static canonical, title, OG tags or JSON-LD here (they differ per route): src/seo/RouteHead.tsx emits them and scripts/prerender.mjs lifts them into <head>. -->

    <!-- Agent discovery — HTML-level Link relations (RFC 8288 / RFC 9727) -->
    <link rel="api-catalog" href="/.well-known/api-catalog" type="application/linkset+json" />
    <link rel="service-doc" href="/docs" />
    <link rel="alternate" href="/llms.txt" type="text/plain" title="LLM-readable summary" />
    <link rel="alternate" type="text/markdown" href="/agents.md" title="Agent onboarding" />

    <!-- Webfonts are loaded by src/styles/tokens/fonts.css (the mock's Google Fonts import). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Dark mode before first paint (same logic as App.tsx: Research is authored dark, so it inverts when the saved theme is light). -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("aidress-site-theme") || "light";
          var mode = localStorage.getItem("aidress-site-mode") || "human";
          var authoredDark = /^\/research(\/|$)/.test(location.pathname) && mode === "human";
          document.documentElement.dataset.theme = (theme === "dark") !== authoredDark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="ad" style="background:var(--stone-100)">
    <div id="root"></div>
    <noscript>
      <!--
        Every route below is prerendered to real HTML at build time (see
        scripts/prerender.mjs), so page content is present without JavaScript.
        This block only (a) forces scroll-reveal wrappers visible, since the
        animation that reveals them never runs without JS, and (b) provides a
        route-agnostic site directory.
      -->
      <style>
        [data-reveal],
        [style*="opacity:0"],
        [style*="opacity: 0"] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
      <nav aria-label="Site directory" style="padding:24px 44px;font:400 14px/1.6 var(--font-sans)">
        <p>Aidress: the coordination protocol for autonomous AI agents.</p>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/industries/">Industries</a></li>
          <li><a href="/developers/">Developers</a></li>
          <li><a href="/docs/">Documentation</a></li>
          <li><a href="/research/">Research</a></li>
          <li><a href="/impact/">Aidress for Good</a></li>
          <li><a href="/crew/">Crew</a></li>
          <li><a href="/for-agents/">For agents</a> (<a href="/agents.md">agents.md</a>)</li>
          <li><a href="/privacy/">Privacy policy</a></li>
          <li><a href="/security/">Security</a></li>
          <li><a href="/llms.txt">llms.txt</a></li>
          <li><a href="/.well-known/security.txt">security.txt</a></li>
        </ul>
      </nav>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
